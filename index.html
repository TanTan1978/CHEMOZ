<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEMOZ - نظام ليبلات أدوية الكيماوي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .header-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        h1 { color: #0a9396; text-align: center; margin: 10px 0 20px 0; font-size: 26px; letter-spacing: 1px; }
        
        .upload-section { border: 2px dashed #0a9396; padding: 25px; text-align: center; border-radius: 8px; background: #f8f9fa; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-section:hover { background: #e9ecef; }
        input[type="file"] { display: none; }
        
        .editor-section { display: none; margin-top: 20px; }
        .preview-img { width: 100%; max-height: 200px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; background: #000; }
        
        .drug-card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .drug-card h4 { margin-top: 0; color: #005f73; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; color: #333; font-size: 13px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .btn { background-color: #0a9396; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; font-weight: bold; }
        .btn:hover { background-color: #005f73; }
        .btn-secondary { background-color: #6c757d; margin-top: 5px; }
        .btn-secondary:hover { background-color: #5a6268; }
    </style>
    <!-- مكتبة إكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- واجهة الصور والعنوان -->
        <img src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=800&q=80" alt="Hospital Building" class="header-img">
        <h1>CHEMOZ</h1>
        
        <!-- قسم رفع الروشتة -->
        <div class="upload-section" onclick="document.getElementById('prescriptionFile').click()">
            <p style="margin: 0; font-size: 16px; color: #0a9396; font-weight: bold;">📷 اضغط لالتقاط صورة الروشتة أو اختيار ملف</p>
            <input type="file" id="prescriptionFile" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <!-- قسم مراجعة وتعديل جميع أدوية الروشتة -->
        <div class="editor-section" id="editorSection">
            <h3 style="text-align: center; color: #333; margin-bottom: 10px;">ملخص أدوية الروشتة (مراجعة وتعديل)</h3>
            <img id="prescriptionPreview" class="preview-img" alt="معاينة الروشتة">

            <div class="form-group">
                <label>اسم المريض:</label>
                <input type="text" id="patientName">
            </div>
            <div class="form-group">
                <label>رقم الـ MRN:</label>
                <input type="text" id="mrn">
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
            
            <!-- حاوية أدوية المريض -->
            <div id="drugsContainer"></div>

            <button class="btn" onclick="generateAndDownloadExcel()">⬇️ توليد ملف إكسل (بشيتات متعددة) وحفظه على الموبايل</button>
            <button class="btn btn-secondary" onclick="resetForm()">إلغاء وإعادة المسح</button>
        </div>
    </div>

    <script>
        let currentDrugsList = [];

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prescriptionPreview').src = e.target.result;
            }
            reader.readAsDataURL(file);

            // افتراض استخراج بيانات لروشتة متعددة الأدوية (مثال بروتوكول FOLFOX أو أدوية متعددة)
            // الصيدلي يمكنه التعديل أو إضافة/حذف أدوية بحرية تامة
            document.getElementById('patientName').value = "RAISA ABDULLAH SHAMRANI";
            document.getElementById('mrn').value = "1024501460";

            // محاكاة الأدوية المستخرجة من الروشتة (مثال متعدد الأدوية)
            currentDrugsList = [
                { drugName: "OXALIPLATIN (5 MG/ML)", dose: 100, diluent: "DEXTROSE 5%", diluentVol: 300, infusionRate: "2 HOURS", sheetName: "Oxaliplatin" },
                { drugName: "CALCIUM FOLINATE (10 MG/ML)", dose: 100, diluent: "DEXTROSE 5%", diluentVol: 250, infusionRate: "2 HOURS", sheetName: "Calcium Folinate" },
                { drugName: "FLUOROURACIL (50 MG/ML)", dose: 400, diluent: "DEXTROSE 5%", diluentVol: 250, infusionRate: "2 HRS", sheetName: "5FU bolus" },
                { drugName: "FLUOROURACIL (50 MG/ML)", dose: 2400, diluent: "SODIUM CHLORIDE 0.9%", diluentVol: 182, infusionRate: "46 HRS INFUSION PUMP", sheetName: "5FU pump" }
            ];

            renderDrugsForm();
            document.getElementById('editorSection').style.display = 'block';
        }

        function renderDrugsForm() {
            const container = document.getElementById('drugsContainer');
            container.innerHTML = '';

            currentDrugsList.forEach((drug, index) => {
                let card = document.createElement('div');
                card.className = 'drug-card';
                card.innerHTML = `
                    <h4>الدواء رقم (${index + 1})</h4>
                    <div class="form-group">
                        <label>اسم الدواء والتركيز:</label>
                        <input type="text" id="drugName_${index}" value="${drug.drugName}">
                    </div>
                    <div class="form-group">
                        <label>الجرعة (MG):</label>
                        <input type="number" id="dose_${index}" value="${drug.dose}">
                    </div>
                    <div class="form-group">
                        <label>السائل المذيب:</label>
                        <input type="text" id="diluent_${index}" value="${drug.diluent}">
                    </div>
                    <div class="form-group">
                        <label>حجم المذيب (ML):</label>
                        <input type="number" id="diluentVol_${index}" value="${drug.diluentVol}">
                    </div>
                    <div class="form-group">
                        <label>مدة التسريب:</label>
                        <input type="text" id="infusionRate_${index}" value="${drug.infusionRate}">
                    </div>
                    <div class="form-group">
                        <label>اسم الشيت في الإكسل:</label>
                        <input type="text" id="sheetName_${index}" value="${drug.sheetName}">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateAndDownloadExcel() {
            const patientName = document.getElementById('patientName').value;
            const mrn = document.getElementById('mrn').value;

            let wb = XLSX.utils.book_new();

            // قراءة البيانات المحدثة من حقول الإدخال لكل دواء
            currentDrugsList.forEach((drug, index) => {
                let dName = document.getElementById(`drugName_${index}`).value;
                let dose = parseFloat(document.getElementById(`dose_${index}`).value) || 0;
                let diluent = document.getElementById(`diluent_${index}`).value;
                let diluentVol = parseFloat(document.getElementById(`diluentVol_${index}`).value) || 0;
                let infusionRate = document.getElementById(`infusionRate_${index}`).value;
                let sheetName = document.getElementById(`sheetName_${index}`).value || `Drug_${index+1}`;

                // حساب الحجم الكلي برمجياً
                // إذا كان 5FU pump مثلاً الحجم ثابت أو محسوب
                let drugVol = dose / 50; // افتراضي كمثال أو حسب التركيز الموجود بالاسم
                if(dName.includes("OXALIPLATIN")) drugVol = dose / 5;
                else if(dName.includes("CALCIUM FOLINATE")) drugVol = dose / 10;
                else if(dName.includes("GEMCITABINE")) drugVol = dose / 40;
                else if(dName.includes("BEVACIZUMAB")) drugVol = dose / 25;

                let totalVol = drugVol + diluentVol;
                if(sheetName.includes("5FU pump")) totalVol = 230; // حجم ثابت للـ pump

                // بناء نص الليبل للخلية A1
                let labelText = `KFAFH - FOR INTRAVENOUS INFUSION\n` +
                                `${dName}    ${dose} MG\n` +
                                `${diluent}    ${diluentVol} ML\n` +
                                (sheetName.includes("5FU pump") ? 
                                    `INFUSED: ${infusionRate}    VOLUME: ${totalVol} ML\n` : 
                                    `INFUSED OVER: ${infusionRate}    VOLUME: ${totalVol} ML\n`) +
                                `Prep Date:        BUD:\n` +
                                `Pt. Name: ${patientName}\n` +
                                `MRN: ${mrn}    WARD: ADULT ONCO\n` +
                                `PREP BY:        CHECKED BY:\n` +
                                `caution: CYTOTOXIC`;

                let ws = XLSX.utils.aoa_to_sheet([[labelText]]);

                // تنسيق الخلية A1 (Calibri 11، التفاف النص، محاذاة لليسار وللأعلى)
                ws['A1'].s = {
                    font: { name: "Calibri", sz: 11 },
                    alignment: { wrapText: true, vertical: "top", horizontal: "left" }
                };

                // ضبط أبعاد الشيت (عرض 47، ارتفاع 140)
                ws['!cols'] = [{ wch: 47 }];
                ws['!rows'] = [{ hpt: 140 }];

                // إضافة الشيت لملف الإكسل
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            // تحميل ملف الإكسل المجمع على الموبايل
            XLSX.writeFile(wb, `${patientName}_Chemo_Labels.xlsx`);
        }

        function resetForm() {
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('prescriptionFile').value = '';
        }
    </script>
</body>
</html>
