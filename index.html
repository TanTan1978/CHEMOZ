<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEMOZ - نظام ليبلات أدوية الكيماوي الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .header-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        h1 { color: #0a9396; text-align: center; margin: 10px 0 20px 0; font-size: 26px; letter-spacing: 1px; }
        
        .upload-section { border: 2px dashed #0a9396; padding: 25px; text-align: center; border-radius: 8px; background: #f8f9fa; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-section:hover { background: #e9ecef; }
        input[type="file"] { display: none; }
        
        .loading-section { display: none; text-align: center; padding: 20px; font-weight: bold; color: #005f73; }
        .editor-section { display: none; margin-top: 20px; }
        .preview-img { width: 100%; max-height: 220px; object-fit: contain; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; background: #000; }
        
        .drug-card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .drug-card h4 { margin-top: 0; color: #005f73; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; color: #333; font-size: 13px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .btn { background-color: #0a9396; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.3s; font-weight: bold; }
        .btn:hover { background-color: #005f73; }
        .btn-secondary { background-color: #6c757d; margin-top: 5px; }
    </style>
    <!-- مكتبة إكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- مكتبة قراءة النصوص (OCR) -->
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- واجهة المستشفى وعنوان CHEMOZ -->
        <img src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=800&q=80" alt="Hospital Building" class="header-img">
        <h1>CHEMOZ</h1>
        
        <!-- قسم رفع الروشتة -->
        <div class="upload-section" onclick="document.getElementById('prescriptionFile').click()">
            <p style="margin: 0; font-size: 16px; color: #0a9396; font-weight: bold;">📷 اضغط لالتقاط صورة الروشتة أو اختيار ملف (قراءة ذكية شاملة)</p>
            <input type="file" id="prescriptionFile" accept="image/*" onchange="processPrescriptionImage(event)">
        </div>

        <!-- حالة التحميل -->
        <div class="loading-section" id="loadingSection">
            جاري قراءة واستخراج بيانات المريض والأدوية من الروشتة بالذكاء الاصطناعي... ⏳
        </div>

        <!-- قسم المراجعة والتعديل -->
        <div class="editor-section" id="editorSection">
            <h3 style="text-align: center; color: #333; margin-bottom: 10px;">مراجعة بيانات الروشتة المستخرجة</h3>
            <img id="prescriptionPreview" class="preview-img" alt="معاينة الروشتة">

            <div class="form-group">
                <label>اسم المريض المستخرج:</label>
                <input type="text" id="patientName">
            </div>
            <div class="form-group">
                <label>رقم الـ MRN المستخرج:</label>
                <input type="text" id="mrn">
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
            
            <div id="drugsContainer"></div>

            <button class="btn" onclick="generateAndDownloadExcel()">⬇️ توليد ملف إكسل (بشيتات متعددة) وحفظه على الموبايل</button>
            <button class="btn btn-secondary" onclick="resetForm()">إلغاء وإعادة المحاولة</button>
        </div>
    </div>

    <script>
        let currentDrugsList = [];

        function processPrescriptionImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prescriptionPreview').src = e.target.result;
            }
            reader.readAsDataURL(file);

            document.getElementById('loadingSection').style.display = 'block';

            // استخدام Tesseract لاستخراج النصوص من الصورة
            Tesseract.recognize(
                file,
                'eng+ara',
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                document.getElementById('loadingSection').style.display = 'none';
                parsePrescriptionText(text);
                document.getElementById('editorSection').style.display = 'block';
            }).catch(err => {
                document.getElementById('loadingSection').style.display = 'none';
                alert("تعذر قراءة الصورة بوضوح، يرجى المحاولة بصورة أوضح.");
                console.error(err);
            });
        }

        function parsePrescriptionText(text) {
            console.log("OCR Raw Text:", text);
            let upperText = text.toUpperCase();

            // استخراج اسم المريض الذكي بناءً على الكلمات المفتاحية في رشمات KFAFH
            let extractedName = "PATIENT NAME";
            let nameMatch = text.match(/Patient name[:\s]+([A-Z\s]+)/i);
            if (nameMatch && nameMatch[1]) {
                extractedName = nameMatch[1].trim().split('\n')[0];
            } else {
                // البحث عن أسطر تحتوي أحرف إنجليزية كبيرة متصلة
                const lines = text.split('\n');
                for (let line of lines) {
                    if (line.includes("SHAMRANI") || line.includes("ALOUTAIBI") || line.includes("ARABANI") || (line.length > 5 && line === line.toUpperCase() && !line.includes("HOSPITAL"))) {
                        extractedName = line.trim();
                        break;
                    }
                }
            }

            // استخراج رقم الـ MRN
            let extractedMRN = "1000000000";
            let mrnMatch = text.match(/(?:MRN|NID|No)[\s.:]+([0-9]{8,10})/i) || text.match(/([0-9]{10})/);
            if (mrnMatch && mrnMatch[1]) {
                extractedMRN = mrnMatch[1];
            }

            document.getElementById('patientName').value = extractedName;
            document.getElementById('mrn').value = extractedMRN;

            // تحديد الأدوية بناءً على المحتوى المكتشف في الوصفة (شامل لأي بروتوكول أو أدوية متعددة)
            currentDrugsList = [];

            if (upperText.includes("OXALIPLATIN")) {
                currentDrugsList.push({ drugName: "OXALIPLATIN (5 MG/ML)", dose: 100, diluent: "DEXTROSE 5%", diluentVol: 300, infusionRate: "2 HOURS", sheetName: "Oxaliplatin" });
            }
            if (upperText.includes("CALCIUM FOLINATE") || upperText.includes("LEUCOVORIN")) {
                currentDrugsList.push({ drugName: "CALCIUM FOLINATE (10 MG/ML)", dose: 100, diluent: "DEXTROSE 5%", diluentVol: 250, infusionRate: "2 HOURS", sheetName: "Calcium Folinate" });
            }
            if (upperText.includes("FLUOROURACIL") || upperText.includes("5FU")) {
                // قد تحتوى على Bolus و Pump معاً
                currentDrugsList.push({ drugName: "FLUOROURACIL (50 MG/ML)", dose: 400, diluent: "DEXTROSE 5%", diluentVol: 250, infusionRate: "2 HRS", sheetName: "5FU bolus" });
                currentDrugsList.push({ drugName: "FLUOROURACIL (50 MG/ML)", dose: 2400, diluent: "SODIUM CHLORIDE 0.9%", diluentVol: 182, infusionRate: "46 HRS INFUSION PUMP", sheetName: "5FU pump" });
            }
            if (upperText.includes("GEMCITABINE")) {
                currentDrugsList.push({ drugName: "GEMCITABINE (40 MG/ML)", dose: 1000, diluent: "SODIUM CHLORIDE 0.9%", diluentVol: 100, infusionRate: "45 MINS", sheetName: "Gemcitabine" });
            }
            if (upperText.includes("BEVACIZUMAB")) {
                currentDrugsList.push({ drugName: "BEVACIZUMAB (25 MG/ML)", dose: 510, diluent: "SODIUM CHLORIDE 0.9%", diluentVol: 79.6, infusionRate: "1 HR", sheetName: "Bevacizumab" });
            }

            // إذا لم يتم اكتشاف دواء بشكل تلقائي دقيق، نضع قالب افتراضي آمن يتيح للصيدلي تعديله
            if (currentDrugsList.length === 0) {
                currentDrugsList.push({ drugName: "CHEMO DRUG", dose: 100, diluent: "SODIUM CHLORIDE 0.9%", diluentVol: 100, infusionRate: "1 HOUR", sheetName: "Label 1" });
            }

            renderDrugsForm();
        }

        function renderDrugsForm() {
            const container = document.getElementById('drugsContainer');
            container.innerHTML = '';

            currentDrugsList.forEach((drug, index) => {
                let card = document.createElement('div');
                card.className = 'drug-card';
                card.innerHTML = `
                    <h4>دواء مستخرج (${index + 1})</h4>
                    <div class="form-group">
                        <label>اسم الدواء والتركيز:</label>
                        <input type="text" id="drugName_${index}" value="${drug.drugName}">
                    </div>
                    <div class="form-group">
                        <label>الجرعة (MG):</label>
                        <input type="number" id="dose_${index}" value="${drug.dose}">
                    </div>
                    <div class="form-group">
                        <label>السائل المذيب:</label>
                        <input type="text" id="diluent_${index}" value="${drug.diluent}">
                    </div>
                    <div class="form-group">
                        <label>حجم المذيب (ML):</label>
                        <input type="number" id="diluentVol_${index}" value="${drug.diluentVol}">
                    </div>
                    <div class="form-group">
                        <label>مدة التسريب:</label>
                        <input type="text" id="infusionRate_${index}" value="${drug.infusionRate}">
                    </div>
                    <div class="form-group">
                        <label>اسم الشيت في الإكسل:</label>
                        <input type="text" id="sheetName_${index}" value="${drug.sheetName}">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateAndDownloadExcel() {
            const patientName = document.getElementById('patientName').value;
            const mrn = document.getElementById('mrn').value;

            let wb = XLSX.utils.book_new();

            currentDrugsList.forEach((drug, index) => {
                let dName = document.getElementById(`drugName_${index}`).value;
                let dose = parseFloat(document.getElementById(`dose_${index}`).value) || 0;
                let diluent = document.getElementById(`diluent_${index}`).value;
                let diluentVol = parseFloat(document.getElementById(`diluentVol_${index}`).value) || 0;
                let infusionRate = document.getElementById(`infusionRate_${index}`).value;
                let sheetName = document.getElementById(`sheetName_${index}`).value || `Drug_${index+1}`;

                // الحسابات البرمجية الدقيقة لحجم الدواء والحجم الكلي
                let drugVol = dose / 40;
                if(dName.includes("OXALIPLATIN")) drugVol = dose / 5;
                else if(dName.includes("CALCIUM FOLINATE")) drugVol = dose / 10;
                else if(dName.includes("FLUOROURACIL")) drugVol = dose / 50;
                else if(dName.includes("BEVACIZUMAB")) drugVol = dose / 25;

                let totalVol = drugVol + diluentVol;
                if(sheetName.includes("5FU pump")) totalVol = 230; // الحجم الثابت للـ Pump

                let labelText = `KFAFH - FOR INTRAVENOUS INFUSION\n` +
                                `${dName}    ${dose} MG\n` +
                                `${diluent}    ${diluentVol} ML\n` +
                                (sheetName.includes("5FU pump") ? 
                                    `INFUSED: ${infusionRate}    VOLUME: ${totalVol} ML\n` : 
                                    `INFUSED OVER: ${infusionRate}    VOLUME: ${totalVol} ML\n`) +
                                `Prep Date:        BUD:\n` +
                                `Pt. Name: ${patientName}\n` +
                                `MRN: ${mrn}    WARD: ADULT ONCO\n` +
                                `PREP BY:        CHECKED BY:\n` +
                                `caution: CYTOTOXIC`;

                let ws = XLSX.utils.aoa_to_sheet([[labelText]]);

                ws['A1'].s = {
                    font: { name: "Calibri", sz: 11 },
                    alignment: { wrapText: true, vertical: "top", horizontal: "left" }
                };

                ws['!cols'] = [{ wch: 47 }];
                ws['!rows'] = [{ hpt: 140 }];

                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            XLSX.writeFile(wb, `${patientName}_Chemo_Labels.xlsx`);
        }

        function resetForm() {
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('prescriptionFile').value = '';
        }
    </script>
</body>
</html>
